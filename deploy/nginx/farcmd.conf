# nginx in front of farcmd-mcp. The app listens on 127.0.0.1:5999 (node directly, or a container
# published only on loopback). Set FARCMD_TRUST_PROXY to the address nginx connects from
# (127.0.0.1 for node on the host; the Docker bridge gateway, e.g. 172.17.0.1, for a published container).
server {
    listen 80;
    listen [::]:80;
    server_name farcmd.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name farcmd.example.org;

    ssl_certificate     /etc/letsencrypt/live/farcmd.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/farcmd.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512k;   # the app accepts at most 256 KiB request bodies

    location / {
        proxy_pass http://127.0.0.1:5999;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # MCP Streamable HTTP may answer with a server-sent event stream: do not buffer it.
        proxy_buffering off;
        proxy_cache off;
        # Level 4/5 calls can stay open while they wait for approval in the browser (up to 5 minutes)
        # plus the SSH run; verifier installs can take a while too.
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
