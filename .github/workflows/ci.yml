name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integrity-e2e:
    # Real OpenSSH server + unprivileged target account + root-owned verifier (needs root: GitHub runners have passwordless sudo).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: sudo -E env "PATH=$PATH" npm run test:e2e

  ui-smoke:
    # Built web UI in headless Chromium: sign in, every page, MCP access switch, sign out.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:ui

  security-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high

  docker:
    # Builds the production image and smoke-tests the running container.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t farcmd-mcp:ci .
      - name: Smoke test
        run: |
          set -eu
          docker run --rm -e NODE_ENV=production farcmd-mcp:ci 2>&1 | grep -q 'Refusing to start with an unsafe production configuration'
          docker run -d --name farcmd -p 127.0.0.1:5999:5999 \
            -e FARCMD_ENCRYPTION_KEY="$(openssl rand -base64 32)" -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e MCP_PUBLIC_URL=https://farcmd.example.org farcmd-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5999/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5999/)" = 200
          curl -fsS http://127.0.0.1:5999/.well-known/oauth-protected-resource | grep -q 'https://farcmd.example.org/mcp'
          test "$(docker exec farcmd whoami)" = node
          printf 'ci-password-1234\n' | docker exec -i farcmd farcmd-admin user create --email ci@example.test --name CI --password-stdin
          docker exec farcmd farcmd-admin registration status | grep -q disabled
          docker exec farcmd farcmd-admin backup /data/backup.sqlite
          docker exec farcmd farcmd-admin audit verify
          for i in $(seq 1 20); do [ "$(docker inspect -f '{{.State.Health.Status}}' farcmd)" = healthy ] && break; sleep 3; done
          test "$(docker inspect -f '{{.State.Health.Status}}' farcmd)" = healthy
      - if: failure()
        run: docker logs farcmd || true
