# farcmd-mcp behind a reverse proxy on the host, e.g. nginx (see deploy/nginx/farcmd.conf and
# docs/deployment.md). For Traefik, use docker-compose.traefik.yml instead.
#
#   cp .env.example .env    # fill in secrets, MCP_PUBLIC_URL, FARCMD_TRUST_PROXY
#   docker compose up -d
#   docker compose exec farcmd farcmd-admin user create --email you@example.org --name "You"
services:
  farcmd:
    build: .
    image: farcmd-mcp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5999"
      STORAGE_PATH: /data/app.sqlite
    volumes:
      - farcmd-data:/data
    # Published on loopback only, so the app is reachable solely through the host's reverse proxy.
    # Override the host port with FARCMD_HOST_PORT in .env (and match proxy_pass in nginx).
    # Connections arrive from this compose network's gateway, not 127.0.0.1, so set
    # FARCMD_TRUST_PROXY to that address:
    #   docker network inspect <project>_default -f '{{(index .IPAM.Config 0).Gateway}}'
    ports:
      - "127.0.0.1:${FARCMD_HOST_PORT:-5999}:5999"

volumes:
  farcmd-data:
